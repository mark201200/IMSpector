[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ims-thesis-tester"
version = "0.1.0"
description = "IMSpector: interface-first CLI for IMS smartphone SIP conformance and differential testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["ims", "sip", "testing", "telecom", "conformance", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/mark201200/IMSpector"
Repository = "https://github.com/mark201200/IMSpector"
Issues = "https://github.com/mark201200/IMSpector/issues"

[project.scripts]
ims-tester = "ims_tester.cli:main"
